<div class="card m-3">
  <h5 class="card-header">Students</h5>
  <div class="card-body">
    @if (errorMessage) {
      <div class="text-danger">{{ errorMessage }}</div>
    }

    <table class="table">
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (student of students; track student.id) {
          <tr>
            <td>{{ student.firstName }}</td>
            <td>{{ student.lastName }}</td>
            <td>{{ student.email }}</td>
            <td>
              <a class="btn btn-secondary mr-1" [routerLink]="['/students', student.id]">Detail</a>
              <a class="btn btn-secondary mr-1" [routerLink]="['/students', student.id, 'edit']">Edit</a>
              <button class="btn btn-secondary" (click)="onDelete(student)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <div class="text-center">
      <a class="btn btn-primary mr-1" routerLink="/students/new">Add a student</a>
      <button class="btn btn-secondary" (click)="onLogout()">Logout</button>
    </div>
  </div>
</div>
